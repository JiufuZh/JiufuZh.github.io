<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Fog of War chess: dataset, training and inference</title>
  <desc id="desc">An illustrated player-view chessboard with hidden squares, beside a three-step pipeline: Dataset, Train, Serve. This is a schematic, not a recorded model run.</desc>
  <defs>
    <pattern id="fog" width="54" height="54" patternUnits="userSpaceOnUse">
      <rect width="54" height="54" fill="#405b63"/>
      <path d="M0 0h27v27H0zM27 27h27v27H27z" fill="#354e58"/>
    </pattern>
    <pattern id="visible" width="54" height="54" patternUnits="userSpaceOnUse">
      <rect width="54" height="54" fill="#f5f7f9"/>
      <path d="M0 0h27v27H0zM27 27h27v27H27z" fill="#bfced6"/>
    </pattern>
    <clipPath id="player-view">
      <path d="M0 135h54v-27h54V81h27v27h27v27h54v81H0z"/>
    </clipPath>
    <g id="pawn" fill="#f8fafb" stroke="#304652" stroke-width="1.3" stroke-linejoin="round">
      <circle cx="13.5" cy="7" r="4"/>
      <path d="M10 11h7l-1 6 4 5H7l4-5z"/>
      <path d="M6 22h15v3H6z"/>
    </g>
    <g id="rook" fill="#f8fafb" stroke="#304652" stroke-width="1.3" stroke-linejoin="round">
      <path d="M6 3h4v4h3V3h3v4h3V3h3v9l-3 3v7H9v-7l-3-3zM7 22h14v3H7z"/>
    </g>
    <g id="knight" fill="#f8fafb" stroke="#304652" stroke-width="1.3" stroke-linejoin="round">
      <path d="m9 3 8 2 5 8-3 8H9l4-7-5 2-4-4 6-5zM7 22h15v3H7z"/>
      <circle cx="13" cy="9" r="1" fill="#304652" stroke="none"/>
    </g>
    <g id="bishop" fill="#f8fafb" stroke="#304652" stroke-width="1.3" stroke-linejoin="round">
      <path d="M14 2c-5 5-7 9-4 12l-1 7h10l-1-7c3-3 1-7-4-12zM7 22h15v3H7z"/>
      <path d="m15 6-3 5" fill="none"/>
    </g>
    <g id="king" fill="#f8fafb" stroke="#304652" stroke-width="1.3" stroke-linejoin="round">
      <path d="M14 1v6M11 4h6" fill="none" stroke-width="2"/>
      <path d="M7 9q7-5 14 0l-4 7 2 5H9l2-5zM7 22h15v3H7z"/>
    </g>
    <g id="queen" fill="#f8fafb" stroke="#304652" stroke-width="1.3" stroke-linejoin="round">
      <path d="m5 5 6 5 3-7 3 7 6-5-5 13 2 3H8l2-3zM7 22h15v3H7z"/>
    </g>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#576d98" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#eef1f5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="46" font-size="26" font-weight="600" fill="#28364c">Fog of War chess</text>
    <g transform="translate(40 83)">
      <rect width="216" height="216" fill="url(#fog)"/>
      <rect width="216" height="216" fill="url(#visible)" clip-path="url(#player-view)"/>
      <use href="#pawn" x="0" y="162"/>
      <use href="#pawn" x="27" y="162"/>
      <use href="#pawn" x="54" y="162"/>
      <use href="#pawn" x="81" y="162"/>
      <use href="#pawn" x="108" y="108"/>
      <use href="#pawn" x="135" y="162"/>
      <use href="#pawn" x="162" y="162"/>
      <use href="#pawn" x="189" y="162"/>
      <use href="#rook" x="0" y="189"/>
      <use href="#knight" x="27" y="189"/>
      <use href="#bishop" x="54" y="189"/>
      <use href="#queen" x="81" y="189"/>
      <use href="#king" x="108" y="189"/>
      <use href="#bishop" x="135" y="189"/>
      <use href="#knight" x="135" y="135"/>
      <use href="#rook" x="189" y="189"/>
      <rect width="216" height="216" fill="none" stroke="#aebcc8"/>
    </g>
    <text x="148" y="328" text-anchor="middle" font-size="19" fill="#536472">Player view</text>
    <path d="M272 191h38" fill="none" stroke="#576d98" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#fff" stroke="#d0d8e2">
      <rect x="332" y="76" width="268" height="70" rx="4"/>
      <rect x="332" y="168" width="268" height="70" rx="4"/>
      <rect x="332" y="260" width="268" height="70" rx="4"/>
    </g>
    <g fill="#384e78" font-size="25" font-weight="600">
      <text x="352" y="108">Dataset</text>
      <text x="352" y="200">Train</text>
      <text x="352" y="292">Serve</text>
    </g>
    <g fill="#536472" font-size="16">
      <text x="352" y="132">Player-view observations</text>
      <text x="352" y="224">Policy + value model</text>
      <text x="352" y="316">Inference + browser bridge</text>
    </g>
    <g stroke="#576d98" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M466 148v14"/>
      <path d="M466 240v14"/>
    </g>
    <text x="40" y="374" font-size="16" fill="#627183">Illustrated workflow</text>
  </g>
</svg>
